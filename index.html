<!DOCTYPE html>
<html>
<head>
    <title>Flood Risk Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: url("https://images.unsplash.com/photo-1500375592092-40eb2168fd21") no-repeat center center fixed;
            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 430px;
            background: rgba(10, 25, 50, 0.85);
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
            box-shadow: 0 0 25px black; 
        }

        input {
            width: 92%;
            padding: 8px;
            margin: 5px 0;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
        }

        button {
            width: 95%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.03);
        }

        #result {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .meter {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 10px;
        }

        .bar {
            height: 12px;
            width: 0%;
            background: green;
            border-radius: 10px;
            transition: 0.5s;
        }

        #percent {
            margin-top: 8px;
            font-weight: bold;
        }

        #statement {
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.5;
            font-weight: 500;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🌊 Flood Risk Prediction</h2>

    <form id="predictForm">

        <input name="MonsoonIntensity" placeholder="Monsoon Intensity">
        <input name="ClimateChange" placeholder="Climate Change">
        <input name="CoastalVulnerability" placeholder="Coastal Vulnerability">

        <input name="DeterioratingInfrastructure" placeholder="Infrastructure">
        <input name="DrainageSystems" placeholder="Drainage Systems">
        <input name="DamsQuality" placeholder="Dams Quality">

        <input name="Urbanization" placeholder="Urbanization">
        <input name="Deforestation" placeholder="Deforestation">
        <input name="Encroachments" placeholder="Encroachments">
        <input name="PopulationScore" placeholder="Population Score">

        <input name="WetlandLoss" placeholder="Wetland Loss">
        <input name="Siltation" placeholder="Siltation">
        <input name="AgriculturalPractices" placeholder="Agriculture">

        <input name="IneffectiveDisasterPreparedness" placeholder="Disaster Preparedness">
        <input name="InadequatePlanning" placeholder="Planning">
        <input name="PoliticalFactors" placeholder="Political Factors">

        <button type="submit">🌊 Predict</button>
    </form>

    <div id="result"></div>

    <h3>Risk Level</h3>

    <div class="meter">
        <div class="bar" id="bar"></div>
    </div>

    <div id="percent"></div>

    <div id="statement"></div>

</div>

<script>
document.getElementById("predictForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const formData = new FormData(e.target);
    const data = {};

    formData.forEach((value, key) => {
        data[key] = parseFloat(value);
    });

    const response = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const result = await response.json();

    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const res = document.getElementById("result");
    const statement = document.getElementById("statement");

    let risk = result.Flood_Prediction === 1 ? 80 : 20;

    bar.style.width = risk + "%";
    percent.innerHTML = "Risk: " + risk + "%";

    if (risk > 50) {
        bar.style.background = "red";

        res.innerHTML = "🚨 HIGH FLOOD RISK";
        res.style.color = "red";

        statement.innerHTML =
            "⚠ Flood risk is HIGH. Heavy rainfall and weak drainage may lead to flooding. Stay alert and avoid low-lying areas.";
    } else {
        bar.style.background = "green";

        res.innerHTML = "🟢 SAFE AREA";
        res.style.color = "lightgreen";

        statement.innerHTML =
            "✔ Flood risk is LOW. Conditions are stable and no immediate flood threat is detected.";
    }
});
</script>

</body>
</html>
